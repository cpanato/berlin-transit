name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions: {}

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: "off"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source:
    name: Go security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check reachable vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: stable
          cache: false
          check-latest: true
          go-package: ./...

      # The upstream gosec action image cannot read Go 1.27 export data.
      # Keep the reviewed compatible importer in the isolated tools module.
      - name: Build and run compatible gosec
        run: |
          mkdir -p .tools/bin
          go -C tools build -o ../.tools/bin/gosec github.com/securego/gosec/v2/cmd/gosec
          go -C tools mod verify
          .tools/bin/gosec -exclude-dir=.tools ./...
