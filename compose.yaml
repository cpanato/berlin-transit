# Operator-managed local deployment only. CI validates/builds but never runs this.
name: berlin-transit
services:
  berlin-transit:
    build:
      context: .
    image: berlin-transit:local
    pull_policy: never
    command: ["serve"]
    env_file:
      - path: .env
        required: true
        format: raw
    environment:
      # Required only inside this isolated container network. These override .env.
      BERLIN_TRANSIT_LISTEN_ADDR: "0.0.0.0:8080"
      BERLIN_TRANSIT_ALLOW_CONTAINER_LISTEN: "true"
      BERLIN_TRANSIT_METRICS_ENABLED: "false"
    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/berlin-transit", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
networks:
  default:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
      com.docker.network.bridge.gateway_mode_ipv4: nat
