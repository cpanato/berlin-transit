name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag pointing to this main commit
        type: string
        required: true
      publish:
        description: Publish release, GHCR image, signatures and provenance
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: "off"

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release authorization
    if: github.repository == 'cpanato/berlin-transit' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # Inspect release environment protection before publication.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the existing tag and protected environment
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          # Matching the workflow SHA keeps provenance aligned with built source.
          test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')
          test "$reviewers" -gt 0

  release:
    name: Publish signed release and provenance
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # Publish archives, signatures and provenance bundles.
      packages: write # Publish and sign the GHCR image by digest.
      id-token: write # GitHub OIDC for keyless signatures and attestations.
      attestations: write # Record build provenance in GitHub.
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      IMAGE: ghcr.io/cpanato/berlin-transit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Recheck the tag after environment approval
        run: test "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: check

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish and sign binaries, checksums and image
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}

      - name: Read the immutable image digest from build metadata
        id: image
        run: |
          digest=$(jq -er --arg image "$IMAGE" '
            [.[] | select(.type == "Docker Manifest" and .extra.ID == "container")
              | select(.path == $image or (.path | startswith($image + ":")))
              | .extra.Digest] | unique
            | if length == 1 and (.[0] | test("^sha256:[a-f0-9]{64}$"))
              then .[0] else error("expected one application image digest") end
          ' dist/artifacts.json)
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest release artifacts and SBOM provenance
        id: artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
            dist/binary_*/berlin-transit*
            dist/sbom/*

      - name: Attest image provenance at the built digest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/cpanato/berlin-transit
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Attach provenance bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_BUNDLE: ${{ steps.artifacts.outputs.bundle-path }}
          IMAGE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$ARTIFACT_BUNDLE" dist/artifacts.provenance.sigstore.json
          cp "$IMAGE_BUNDLE" dist/image.provenance.sigstore.json
          gh release upload "$RELEASE_TAG" \
            dist/artifacts.provenance.sigstore.json dist/image.provenance.sigstore.json
