{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "berlin-transit.name" . }}
  labels:
    {{- include "berlin-transit.selector" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "berlin-transit.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
