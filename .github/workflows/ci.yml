name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: "off"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format, vet, test, race and coverage
        run: |
          make check
          make coverage
      - name: Verify module integrity and tidy state
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git ls-files --others --exclude-standard -- go.mod go.sum)"
          go -C tools mod tidy
          git diff --exit-code -- tools/go.mod tools/go.sum
          test -z "$(git ls-files --others --exclude-standard -- tools/go.mod tools/go.sum)"
      - name: Install pinned linters
        run: |
          sh scripts/install-tool.sh golangci-lint
          sh scripts/install-tool.sh actionlint
      - name: Lint Go and workflows
        run: |
          .tools/bin/golangci-lint config verify
          .tools/bin/golangci-lint run
          .tools/bin/actionlint
      - name: Fuzz bounded inputs and upstream JSON
        run: |
          go test ./internal/provider/vbb -run '^$' -fuzz '^FuzzValidation$' -fuzztime=10s -parallel=2
          go test ./internal/provider/vbb -run '^$' -fuzz '^FuzzDepartureJSON$' -fuzztime=10s -parallel=2
      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: error

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile CLI without publishing
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: make build
