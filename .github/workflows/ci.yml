name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: "off"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
          check-latest: true

      - name: Format, vet, test, race and coverage
        run: |
          make check
          make coverage

      - name: Build local private-plugin import bundle
        run: make trmnl-package

      - name: Verify module integrity and tidy state
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git ls-files --others --exclude-standard -- go.mod go.sum)"
          go -C tools mod tidy
          git diff --exit-code -- tools/go.mod tools/go.sum
          test -z "$(git ls-files --others --exclude-standard -- tools/go.mod tools/go.sum)"

      - name: Fuzz bounded inputs and upstream JSON
        run: |
          go test ./internal/provider/vbb -run '^$' -fuzz '^FuzzValidation$' -fuzztime=10s -parallel=2
          go test ./internal/provider/vbb -run '^$' -fuzz '^FuzzDepartureJSON$' -fuzztime=10s -parallel=2
          go test ./internal/httpapi -run '^$' -fuzz '^FuzzQuery$' -fuzztime=10s -parallel=2

      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15
          skip-cache: true
